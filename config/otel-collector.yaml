# OTel Collector config for the Graft dev stack.
#
# Receives OTLP telemetry from all services, routes to:
#   Traces  → Tempo  (via OTLP HTTP)
#   Traces  → Langfuse (via OTLP HTTP fan-out, for LLM eval tracking)
#   Metrics → Mimir  (via OTLP HTTP)
#   Logs    → Loki   (via OTLP HTTP)
#
# Also runs the spanmetrics connector to generate RED metrics from traces.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://*"
            - "https://*"

exporters:
  debug:
    verbosity: basic
  otlphttp/tempo:
    endpoint: "http://tempo:4318"
    tls:
      insecure: true
  otlphttp/mimir:
    endpoint: "http://mimir:9009/otlp"
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: "http://loki:3100/otlp"
    tls:
      insecure: true
  # Fan-out traces and logs to Langfuse for LLM session tracking and eval.
  # Langfuse's OTLP endpoint is exposed on its internal port 3000 (not the
  # host-mapped 4100 — that's only for browser access).
  otlphttp/langfuse:
    endpoint: "http://langfuse-web:3000/api/public/otel"
    tls:
      insecure: true
    headers:
      # Basic auth: base64("${LANGFUSE_PUBLIC_KEY}:${LANGFUSE_SECRET_KEY}")
      # Default dev keys encode to: bGYtcGstZGV2LTAwMDAwMDAwMDAwMDAwMDA6bGYtc2stZGV2LTAwMDAwMDAwMDAwMDAwMDA=
      Authorization: "Basic bGYtcGstZGV2LTAwMDAwMDAwMDAwMDAwMDA6bGYtc2stZGV2LTAwMDAwMDAwMDAwMDAwMDA="

processors:
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25
  resourcedetection:
    detectors: [env, system]
  batch:
  # Filter: only forward orca-backend spans to Langfuse (avoids noise from other services)
  filter/langfuse:
    error_mode: ignore
    traces:
      span:
        - 'resource.attributes["service.name"] == "orca-backend"'

connectors:
  spanmetrics:
    dimensions:
      - name: http.response.status_code
        default: ""
      - name: http.request.method
        default: ""
      - name: rpc.grpc.status_code
        default: ""

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resourcedetection, memory_limiter, batch]
      exporters: [otlphttp/tempo, spanmetrics, debug]
    traces/langfuse:
      receivers: [otlp]
      processors: [resourcedetection, memory_limiter, filter/langfuse, batch]
      exporters: [otlphttp/langfuse]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [resourcedetection, memory_limiter, batch]
      exporters: [otlphttp/mimir, debug]
    logs:
      receivers: [otlp]
      processors: [resourcedetection, memory_limiter, batch]
      exporters: [otlphttp/loki, debug]
    logs/langfuse:
      receivers: [otlp]
      processors: [resourcedetection, memory_limiter, filter/langfuse, batch]
      exporters: [otlphttp/langfuse]

