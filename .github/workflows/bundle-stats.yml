name: Bundle Stats

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package*.json'
      - '.config/**'
      - '.github/workflows/bundle-stats.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package*.json'
      - '.config/**'
      - '.github/workflows/bundle-stats.yml'

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  compare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: grafana/plugin-actions/bundle-size@6b3176d6bd4b6885b6433410aeb42de2f76d8a09 # bundle-size/v1.0.2
